<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACMI — Timeline Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Montserrat:wght@500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper:        #faf9f5;
      --paper-warm:   #f4f2eb;
      --paper-shadow: #ebe8de;
      --paper-deep:   #e4dfd3;
      --ink:       #1a1a1a;
      --ink-soft:  #2c2c2a;
      --ink-mute:  #4a4a48;
      --ink-fade:  #7a7a76;
      --ink-quiet: #9a9a96;
      --ink-rule:  #d4d2cc;
      --accent:        #2d4a3e;
      --accent-soft:   #5a7d6f;
      --accent-quiet:  #1c3027;
      --accent-glow:   rgba(45, 74, 62, 0.12);
      --danger:   #8b3a3a;
      --warn:     #8b6914;
      --font-display: 'Montserrat', system-ui, sans-serif;
      --font-body:    'Raleway', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', 'SF Mono', Consolas, monospace;
      --radius-sm: 3px;
      --radius-md: 4px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-fast: 180ms;
      --header-h: 56px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    ::selection { background: var(--ink); color: var(--paper); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--paper); }
    ::-webkit-scrollbar-thumb { background: var(--ink-rule); border-radius: 2px; }

    .app-shell { display: flex; flex-direction: column; height: 100vh; }

    /* Header */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      height: var(--header-h); padding: 0 20px;
      border-bottom: 1px solid var(--ink-rule);
      background: var(--paper); flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-link {
      font-family: var(--font-mono); font-size: 11px; color: var(--ink-fade);
      text-decoration: none; display: flex; align-items: center; gap: 4px;
      transition: color var(--dur-fast) var(--ease);
    }
    .back-link:hover { color: var(--accent); }
    .brand-name { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
    .brand-name span { color: var(--ink-fade); font-weight: 400; }

    .header-meta {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--font-mono); font-size: 10px; color: var(--ink-fade);
    }
    .header-meta .live-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    /* Toolbar */
    .toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-bottom: 1px solid var(--ink-rule);
      background: var(--paper-warm); flex-shrink: 0;
      flex-wrap: wrap;
    }
    .toolbar-search {
      display: flex; align-items: center; gap: 6px;
      flex: 1; min-width: 200px;
    }
    .toolbar-search input {
      flex: 1; min-width: 160px;
      height: 28px; padding: 0 8px;
      font-family: var(--font-mono); font-size: 11px;
      background: var(--paper);
      border: 1px solid var(--ink-rule);
      border-radius: var(--radius-sm);
      color: var(--ink);
      outline: none;
      transition: border-color var(--dur-fast) var(--ease);
    }
    .toolbar-search input:focus { border-color: var(--accent); }
    .toolbar-search input::placeholder { color: var(--ink-quiet); }

    .filter-chip-group {
      display: flex; gap: 4px; flex-wrap: wrap;
    }
    .filter-chip {
      font-family: var(--font-mono); font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.10em;
      padding: 3px 8px; border-radius: 2px;
      border: 1px solid var(--ink-rule);
      background: var(--paper);
      color: var(--ink-fade);
      cursor: pointer; transition: all var(--dur-fast) var(--ease);
      white-space: nowrap;
    }
    .filter-chip:hover { border-color: var(--ink-mute); color: var(--ink); }
    .filter-chip.active {
      border-color: var(--accent); background: var(--accent-glow);
      color: var(--accent);
    }
    .filter-chip.active-warn {
      border-color: var(--warn); background: rgba(139, 105, 20, 0.08);
      color: var(--warn);
    }
    .toolbar-actions { display: flex; gap: 6px; }

    /* Stream area */
    .stream-wrapper {
      flex: 1; overflow-y: auto; position: relative;
    }

    /* Day divider */
    .day-divider {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px 4px;
      font-family: var(--font-mono); font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--ink-fade);
      position: sticky; top: 0;
      background: var(--paper);
      z-index: 2;
    }
    .day-divider::after {
      content: ''; flex: 1; height: 1px;
      background: var(--ink-rule);
    }

    /* Event row */
    .tl-event {
      display: flex; gap: 10px;
      padding: 6px 20px 6px 20px;
      border-bottom: 1px solid var(--ink-rule);
      transition: background var(--dur-fast) var(--ease);
      cursor: pointer;
    }
    .tl-event:hover { background: var(--paper-warm); }
    .tl-event.expanded { background: var(--paper-warm); }

    .tl-line {
      width: 2px; flex-shrink: 0; background: var(--ink-rule);
      border-radius: 1px; position: relative; margin-top: 4px;
    }
    .tl-line::before {
      content: ''; position: absolute; top: 0; left: -2px;
      width: 6px; height: 6px; border-radius: 50%; background: var(--ink-rule);
    }
    .tl-line.is-accent { background: var(--accent); }
    .tl-line.is-accent::before { background: var(--accent); }
    .tl-line.is-warn { background: var(--warn); }
    .tl-line.is-warn::before { background: var(--warn); }
    .tl-line.is-danger { background: var(--danger); }
    .tl-line.is-danger::before { background: var(--danger); }

    .tl-body { flex: 1; min-width: 0; }
    .tl-meta {
      display: flex; align-items: center; gap: 6px; margin-bottom: 1px;
    }
    .tl-source {
      font-family: var(--font-mono); font-size: 9px; font-weight: 500;
      color: var(--ink-fade); text-transform: uppercase; letter-spacing: 0.08em;
    }
    .tl-kind {
      font-family: var(--font-mono); font-size: 9px; padding: 1px 5px;
      border-radius: 2px; color: var(--accent);
      background: var(--accent-glow);
    }
    .tl-kind.warn-kind { color: var(--warn); background: rgba(139, 105, 20, 0.08); }
    .tl-kind.danger-kind { color: var(--danger); background: rgba(139, 58, 58, 0.08); }
    .tl-kind.quiet-kind { color: var(--ink-fade); background: transparent; }

    .tl-ns {
      font-family: var(--font-mono); font-size: 8px;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--ink-quiet);
    }
    .tl-ts {
      font-family: var(--font-mono); font-size: 10px;
      color: var(--ink-quiet); margin-left: auto; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .tl-summary {
      font-size: 12px; color: var(--ink);
      line-height: 1.4;
    }
    .tl-summary .at { color: var(--accent); font-weight: 500; }

    /* Expanded detail */
    .tl-detail {
      display: none;
      margin-top: 8px; padding: 10px 12px;
      background: var(--paper-shadow);
      border: 1px solid var(--ink-rule);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono); font-size: 10px;
      line-height: 1.6;
      overflow-x: auto;
    }
    .tl-event.expanded .tl-detail { display: block; }

    .tl-detail-row {
      display: flex; gap: 8px; padding: 2px 0;
    }
    .tl-detail-row .key {
      color: var(--ink-fade); min-width: 90px; flex-shrink: 0;
    }
    .tl-detail-row .val {
      color: var(--ink); word-break: break-all;
    }
    .tl-detail-row .val.corr { color: var(--accent); }

    /* Empty */
    .tl-empty {
      text-align: center; padding: 60px 20px;
      color: var(--ink-fade);
    }
    .tl-empty p { font-size: 13px; }

    /* Live badge */
    .live-badge {
      display: inline-block;
      font-family: var(--font-mono); font-size: 8px;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 1px 4px; border-radius: 2px;
      margin-left: 4px;
    }

    /* Stats bar */
    .stats-bar {
      display: flex; gap: 16px; align-items: center;
      padding: 4px 20px;
      border-top: 1px solid var(--ink-rule);
      background: var(--paper-warm);
      font-family: var(--font-mono); font-size: 9px;
      color: var(--ink-fade);
      flex-shrink: 0;
    }
    .stats-bar .stat { display: flex; gap: 4px; }
    .stats-bar .stat .num { color: var(--ink); font-weight: 500; }

    @media (max-width: 768px) {
      .header-left .back-link { display: none !important; }
      .toolbar { padding: 8px 12px; }
      .filter-chip-group { order: 3; width: 100%; }
      .tl-event { padding: 6px 12px; }
      .day-divider { padding: 10px 12px 4px; }
      .mobile-nav { display: block; }
      .stats-bar { margin-bottom: 48px; }
    }

    /* ─── Mobile Nav Bar ──────────────────────────────────────────── */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: var(--paper-warm);
      border-top: 1px solid var(--ink-rule);
      z-index: 100;
      overflow-x: auto;
    }
    .mobile-nav .items {
      display: flex;
      gap: 0;
      height: 100%;
    }
    .mobile-nav .mob-item {
      flex: 1;
      min-width: 48px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--ink-fade);
      cursor: pointer;
      transition: color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
      border: none;
      background: none;
      padding: 4px;
      text-decoration: none;
    }
    .mobile-nav .mob-item.active {
      color: var(--accent);
      font-weight: 600;
      border-top: 2px solid var(--accent);
    }
    .mobile-nav .mob-item:active {
      transform: scale(1.05);
    }
    .mobile-nav .mob-item svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <a href="index.html" class="back-link">← Fleet</a>
        <div class="brand-name">ACMI <span>Timeline</span></div>
      </div>
      <div class="header-meta">
        <span class="live-dot"></span>
        <span>streaming live</span>
        <span id="eventCount" style="font-variant-numeric:tabular-nums;">142 events</span>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-search">
        <input type="text" id="searchInput" placeholder="Search events, @mentions, correlationId…" />
      </div>
      <div class="filter-chip-group" id="filterGroup">
        <span class="filter-chip active" data-filter="all">All</span>
        <span class="filter-chip" data-filter="coord-note">coord-note</span>
        <span class="filter-chip" data-filter="milestone-shipped">milestone</span>
        <span class="filter-chip" data-filter="design-system-spec">design-spec</span>
        <span class="filter-chip" data-filter="scope-decision">decision</span>
        <span class="filter-chip" data-filter="task-delegation">handoff</span>
        <span class="filter-chip" data-filter="heartbeat">heartbeat</span>
        <span class="filter-chip" data-filter="incident-update">incident</span>
      </div>
      <div class="toolbar-actions">
        <button class="filter-chip" id="clearFilters" title="Clear filters">Clear</button>
      </div>
    </div>

    <!-- Stream -->
    <div class="stream-wrapper" id="stream">
      <!-- Dynamic stream will be rendered here -->
      <div class="tl-empty" id="emptyState" style="display: none;">
        <p>No events match the current filter criteria.</p>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar">
      <span class="stat">events <span class="num" id="visibleCount">0</span></span>
      <span class="stat">sources <span class="num" id="sourcesCount">0</span></span>
      <span class="stat">kinds <span class="num" id="kindsCount">0</span></span>
      <span class="stat">namespaces <span class="num" id="namespacesCount">0</span></span>
      <span class="stat">live <span class="num" style="color:var(--accent);">now</span></span>
    </div>
  </div>

  <!-- Live ACMI Hydration & Mobile Navigation Setup -->
  <script src="acmi-client.js"></script>
  <script>
    // Escape HTML utility
    function escapeHtml(str) {
      if (!str) return '';
      return str.toString()
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Time clock formatter
    function formatClockTime(ts) {
      if (!ts) return '12:00:00';
      var d = new Date(ts);
      if (isNaN(d.getTime())) return '12:00:00';
      var h = String(d.getHours()).padStart(2, '0');
      var m = String(d.getMinutes()).padStart(2, '0');
      var s = String(d.getSeconds()).padStart(2, '0');
      return h + ':' + m + ':' + s;
    }

    // URL parameter preservation utility
    function preserveUrlParams() {
      var params = window.location.search;
      if (!params) return;
      document.querySelectorAll('a[href]').forEach(function(el) {
        var href = el.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('#')) {
          var base = href.split('?')[0];
          var existingParams = href.split('?')[1] || '';
          
          var merged = new URLSearchParams(params);
          var anchorParams = new URLSearchParams(existingParams);
          anchorParams.forEach(function(val, key) {
            merged.set(key, val);
          });
          
          el.setAttribute('href', base + '?' + merged.toString());
        }
      });
    }

    // Dynamic Mobile Bottom Nav Bar Append
    function appendMobileNav() {
      if (document.getElementById('mobileNav')) return;
      var navHtml = 
        '<nav class="mobile-nav" id="mobileNav">' +
          '<div class="items">' +
            '<a href="acmi-fleet-command.html" class="mob-item" id="mob-fleet">' +
              '<svg viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M1 5h12M5 1v12" stroke="currentColor" stroke-width="1.2"/></svg>' +
              '<span>Fleet</span>' +
            '</a>' +
            '<a href="agent.html" class="mob-item" id="mob-agents">' +
              '<svg viewBox="0 0 14 14"><circle cx="7" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2 13c0-2.8 2.2-5 5-5s5 2.2 5 5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>' +
              '<span>Agents</span>' +
            '</a>' +
            '<a href="timeline.html" class="mob-item active" id="mob-timeline">' +
              '<svg viewBox="0 0 14 14"><path d="M1 3h12M1 7h12M1 11h12M2 3a1 1 0 110-2 1 1 0 010 2zm0 4a1 1 0 110-2 1 1 0 010 2zm0 4a1 1 0 110-2 1 1 0 010 2z" stroke="currentColor" stroke-width="1.2" fill="currentColor"/></svg>' +
              '<span>Timeline</span>' +
            '</a>' +
            '<a href="gsd-dashboard.html" class="mob-item" id="mob-work">' +
              '<svg viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4 4v6M7 4v6M10 4v6" stroke="currentColor" stroke-width="1.2"/></svg>' +
              '<span>Work</span>' +
            '</a>' +
          '</div>' +
        '</nav>';
      document.body.insertAdjacentHTML('beforeend', navHtml);
    }

    var client = null;
    var allEvents = [];
    var initFired = false;

    function initTimeline() {
      if (initFired) return;
      initFired = true;
      appendMobileNav();

      client = new ACMIClient();

      hydrateTimeline();

      // Connect WebSockets for live updates
      client.connectWebSocket();
      client.on('change', function(msg) {
        console.log('[Timeline WS] Change detected, silently reloading...', msg);
        hydrateTimeline();
      });

      // Bind search filter event listeners
      document.getElementById('searchInput').addEventListener('input', applyFilters);

      var filterChips = document.querySelectorAll('.filter-chip[data-filter]');
      filterChips.forEach(function(chip) {
        chip.addEventListener('click', function() {
          filterChips.forEach(function(c) { c.classList.remove('active'); });
          this.classList.add('active');
          applyFilters();
        });
      });

      document.getElementById('clearFilters').addEventListener('click', function() {
        document.getElementById('searchInput').value = '';
        filterChips.forEach(function(c) { c.classList.remove('active'); });
        document.querySelector('.filter-chip[data-filter="all"]').classList.add('active');
        applyFilters();
      });

      // Event delegation for accordion toggling
      document.getElementById('stream').addEventListener('click', function(e) {
        var eventCard = e.target.closest('.tl-event');
        if (!eventCard) return;
        if (e.target.closest('.tl-detail')) return;
        eventCard.classList.toggle('expanded');
      });
    }

    function hydrateTimeline() {
      if (!client) return;
      client.dashboardBootstrap().then(function(data) {
        console.log('[Timeline Hydration] Loaded bootstrap data:', data);
        allEvents = data.timeline || [];
        
        // Update total events count in header
        var countNode = document.getElementById('eventCount');
        if (countNode) {
          countNode.textContent = allEvents.length + ' events';
        }

        applyFilters();
      }).catch(function(err) {
        console.error('[Timeline Hydration] Error:', err);
      });
    }

    function applyFilters() {
      var search = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      var activeChip = document.querySelector('.filter-chip[data-filter].active');
      var filterKind = activeChip ? activeChip.getAttribute('data-filter') : 'all';

      var filtered = allEvents.filter(function(e) {
        var kind = e.kind || '';
        var source = e.source || '';
        var corr = e.correlationId || '';
        var ns = e.namespace || '';
        var text = (e.summary || e.text || '').toLowerCase();

        var matchFilter = (filterKind === 'all' || kind === filterKind);
        var matchSearch = true;
        if (search) {
          matchSearch = text.indexOf(search) !== -1 ||
                        source.toLowerCase().indexOf(search) !== -1 ||
                        corr.toLowerCase().indexOf(search) !== -1 ||
                        ns.toLowerCase().indexOf(search) !== -1;
        }

        return matchFilter && matchSearch;
      });

      renderTimeline(filtered);
    }

    function renderTimeline(events) {
      var streamNode = document.getElementById('stream');
      var emptyNode = document.getElementById('emptyState');
      
      // Remove all elements except emptyState
      var children = Array.prototype.slice.call(streamNode.children);
      children.forEach(function(child) {
        if (child !== emptyNode) {
          streamNode.removeChild(child);
        }
      });

      if (events.length === 0) {
        emptyNode.style.display = 'block';
        updateStats(0, 0, 0, 0);
        return;
      }
      emptyNode.style.display = 'none';

      // Group events by day
      var groups = {};
      var groupOrder = [];
      
      events.forEach(function(e) {
        var dateStr = 'Today';
        if (e.timestamp) {
          var date = new Date(e.timestamp);
          var today = new Date();
          var yesterday = new Date(today);
          yesterday.setDate(yesterday.getDate() - 1);

          if (date.toDateString() === today.toDateString()) {
            dateStr = 'Today · ' + date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          } else if (date.toDateString() === yesterday.toDateString()) {
            dateStr = 'Yesterday · ' + date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          } else {
            dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          }
        }
        if (!groups[dateStr]) {
          groups[dateStr] = [];
          groupOrder.push(dateStr);
        }
        groups[dateStr].push(e);
      });

      var uniqueSources = {};
      var uniqueKinds = {};
      var uniqueNamespaces = {};

      groupOrder.forEach(function(day) {
        // Append day divider
        var dividerHtml = '<div class="day-divider">' + escapeHtml(day) + '</div>';
        streamNode.insertAdjacentHTML('beforeend', dividerHtml);

        var dayEvents = groups[day];
        dayEvents.forEach(function(e) {
          var kind = e.kind || 'event';
          var source = e.source || 'system';
          var ns = e.namespace || '';

          uniqueSources[source] = true;
          uniqueKinds[kind] = true;
          if (ns) uniqueNamespaces[ns] = true;

          // Compute color indicator classes
          var lineClass = 'tl-line';
          var kindClass = 'tl-kind';
          
          if (kind === 'scope-decision' || kind === 'milestone-shipped' || kind === 'design-system-spec' || kind === 'task-delegation') {
            lineClass = 'tl-line is-accent';
          } else if (kind === 'incident-update') {
            var summaryLower = (e.summary || e.text || '').toLowerCase();
            if (summaryLower.indexOf('blocked') !== -1 || summaryLower.indexOf('error') !== -1 || summaryLower.indexOf('fail') !== -1) {
              lineClass = 'tl-line is-danger';
              kindClass = 'tl-kind danger-kind';
            } else {
              lineClass = 'tl-line is-warn';
              kindClass = 'tl-kind warn-kind';
            }
          } else {
            kindClass = 'tl-kind quiet-kind';
          }

          var timeStr = e.timestamp ? formatClockTime(e.timestamp) : '12:00:00';
          
          // Render properties in detail panel dynamically as clean key-value pre lists
          var detailsRowsHtml = '';
          for (var key in e) {
            if (e.hasOwnProperty(key) && e[key] !== undefined && e[key] !== null) {
              var val = typeof e[key] === 'object' ? JSON.stringify(e[key]) : e[key];
              var corrClass = (key === 'correlationId' || key === 'parentCorrelationId') ? 'val corr' : 'val';
              detailsRowsHtml += 
                '<div class="tl-detail-row">' +
                  '<span class="key">' + escapeHtml(key) + '</span>' +
                  '<span class="' + corrClass + '">' + escapeHtml(val) + '</span>' +
                '</div>';
            }
          }

          var eventHtml = 
            '<div class="tl-event" data-kind="' + escapeHtml(kind) + '" data-source="' + escapeHtml(source) + '" data-corr="' + escapeHtml(e.correlationId || '') + '">' +
              '<div class="' + lineClass + '"></div>' +
              '<div class="tl-body">' +
                '<div class="tl-meta">' +
                  '<span class="tl-source">' + escapeHtml(source) + '</span>' +
                  '<span class="' + kindClass + '">' + escapeHtml(kind) + '</span>' +
                  (ns ? '<span class="tl-ns">' + escapeHtml(ns) + '</span>' : '') +
                  '<span class="tl-ts">' + escapeHtml(timeStr) + '</span>' +
                '</div>' +
                '<div class="tl-summary">' +
                  escapeHtml(e.summary || e.text || '') +
                '</div>' +
                '<div class="tl-detail">' +
                  detailsRowsHtml +
                '</div>' +
              '</div>' +
            '</div>';

          streamNode.insertAdjacentHTML('beforeend', eventHtml);
        });
      });

      // Update metadata metrics counts in stats bar
      updateStats(
        events.length, 
        Object.keys(uniqueSources).length, 
        Object.keys(uniqueKinds).length, 
        Object.keys(uniqueNamespaces).length
      );

      // Preserve query params across nav clicks
      preserveUrlParams();
    }

    function updateStats(visible, sources, kinds, namespaces) {
      var visibleNode = document.getElementById('visibleCount');
      var sourcesNode = document.getElementById('sourcesCount');
      var kindsNode = document.getElementById('kindsCount');
      var nsNode = document.getElementById('namespacesCount');

      if (visibleNode) visibleNode.textContent = visible;
      if (sourcesNode) sourcesNode.textContent = sources;
      if (kindsNode) kindsNode.textContent = kinds;
      if (nsNode) nsNode.textContent = namespaces;
    }

    // Initialize on ready
    document.addEventListener('DOMContentLoaded', initTimeline);
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      initTimeline();
    }
  </script>
</body>
</html>
